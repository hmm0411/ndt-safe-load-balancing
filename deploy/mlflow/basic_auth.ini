# MLflow basic-auth settings used by scripts/mlflow/serve.sh.
#
# The admin password is NOT stored here. It comes from MLFLOW_AUTH_ADMIN_PASSWORD
# (systemd EnvironmentFile, see deploy/mlflow/mlflow.service) and is only read the
# first time the server starts with an empty user store.
[mlflow]
# Every logged-in user can read every experiment; writing needs a grant.
default_permission = READ
# Relative to the repo root (serve.sh runs from there); git-ignored.
database_uri = sqlite:///basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
