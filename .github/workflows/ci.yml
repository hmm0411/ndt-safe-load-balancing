name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-controller-extra.txt

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check src/schemas src/telemetry src/orchestrator/app.py src/orchestrator/current_state.py tests/unit

      - name: Mypy (MVP modules)
        run: mypy --ignore-missing-imports src/schemas src/telemetry src/orchestrator/current_state.py

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
