# Week 15 Day 6, stage 1 (My, 24/11: option C = test first, collect the full matrix only if
# the 2C outcome models fail). These 50 MIGRATE attempts are the outcome part of the transfer
# test (configs/experiments/transfer_4c_v1.yaml): 5 workloads x 2 destination levels (the
# levels the 2C models were trained on) x 5 seeds. Source c1; the destination rotates over
# c2-c4 and the phase over the workload's three, so each gets an equal share. The two other
# controllers run the workload as well (My, 24/11), as in the forecast transfer runs.
# Probe off (Huong 2); capacity-v6.
# Stage 2 (only if the transfer test fails): a new config with 5 destination levels, all phases.
#   python3 scripts/experiments/run_migration_outcome.py \
#     --config configs/experiments/migration_outcome_4c_v1.yaml \
#     --capacity-json data/benchmarks/controller_capacity_v6.json \
#     --capacity-runs data/benchmarks/capacity_runs_4c40s.csv \
#     --capacity-experiment capacity-4c40s-coarse --capacity-experiment capacity-4c40s-noprobe-fine
schema_version: migration-outcome-v1
topology: 4C40S
controllers_config: configs/controllers_4c40s.yaml
output_root: data/experiment_runs/migration-outcome-4c-v1
pre_window_valid_snapshots: 5
post_window_valid_snapshots: 5
post_window_timeout_s: 60
workloads:
  stable: [early, middle, late]
  gradual: [u40, u60, u95]
  burst: [baseline_1, burst_1, recovery]
  oscillating: [rising, peak, falling]
  hot_switch: [moderate, high, peak]
destination_load_levels: [0.45, 0.75]
seeded_targets: {source: c1, targets: [c2, c3, c4]}
phase_policy: rotate_one
# same seeds as transfer_4c_v1.yaml (outcome part); never used to train or tune a 2C model
repeats: {r01: 9701, r02: 9702, r03: 9703, r04: 9704, r05: 9705}
split: {test: [r01, r02, r03, r04, r05]}
no_op_controls: 0
