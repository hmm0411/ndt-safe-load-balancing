# Closed-loop campaign on 4C40S (docs/evaluation-protocol-v1.md, scenarios B and C).
# Fixed before any campaign episode runs; a change after results = section "Thay doi".
version: campaign-4c-v1
topology: 4C40S
controllers_config: configs/controllers_4c40s.yaml
capacity: data/benchmarks/controller_capacity_v5_noprobe.json
forecast_config: configs/forecasting/runtime_4c40s.yaml
outcome_config: configs/outcome/runtime_4c40s.yaml
safety_policy: configs/decision/safety_policy_4c_v1.yaml   # post-migration-v2 (pilot 26/11)
ranking_policy: configs/decision/ranking_policy_4c_v1.yaml # ranks safety-policy-4c-v1
capacity_runs: data/benchmarks/capacity_runs_4c40s.csv
capacity_experiments: [capacity-4c40s-coarse, capacity-4c40s-noprobe-fine]   # probe-off mapping
# Load (decided 26/11, My): c1 runs the workload with its target utilization x 1.2 (same
# shapes; gradual peaks ~1.14). The other controllers hold 0.60, the level of the stable
# workload in the forecast training data. First chosen 0.45; the pilot of 26/11 showed
# forecast-models-v4 predicting U ~0.9-1.1 for controllers flat at 0.42 (a sustained flat
# low level never occurs in its training data, where low flat U precedes a rise), which
# marked every destination at risk; 0.60 + one switch + m_U still stays below 1.
load:
  scaled_controller: c1
  scale: 1.2
  other_level: 0.60
seeds: [9801, 9802, 9803, 9804, 9805, 9806, 9807, 9808, 9809, 9810]   # protocol 5
order_seed: 20261202          # shuffles the run order (protocol 5), declared here
warmup_s: 30                  # protocol 5 (24/11)
duration_s: 240               # chot 26/11 (My) tu pilot: 30 s warm-up + 165 s execute + 45 s post
workloads: [stable, gradual, burst, oscillating, hot_switch]
scenarios:
  B: [static, threshold, forecast_only, ndt_no_feedback, full]                 # 250 episodes
  C: [full_analytical, full_zero_margin, full_random_rank, full_no_cooldown]  # 200 episodes
# Fault scenarios D (protocol 4.D, src/experiments/final_evaluation/faults.py). Decided 26/11
# (My): D1-D6 with Full x 3 seeds; D7 at 5 destination levels x (Full, Threshold) x 10 seeds
# (d7_seeds, raised from 3 on 28/11); 118 episodes. c1 holds constant 1.0 (x 1.2 scale = 1.2, overloaded all episode); c2-c4 hold
# dst_level (D1-D6) or each d7 level. The orchestrator of a D episode runs with
# NDT_FAULT_INJECTION=1 (D1/D2); D3-D6 are signals and requests made by the runner.
faults:
  seeds: [9801, 9802, 9803]
  order_seed: 20261203
  c1_level: 1.0
  dst_level: 0.60
  start_s: 30            # end of the warm-up
  window_s: 60
  effect_grace_s: 4.0    # a frozen sample is stale only after 2.5 s (+ one snapshot)
  migrate_at_s: 40       # D4-D6: the injected migration
  timeout_freeze_s: 4.5  # D4: > role_request_timeout_seconds (3.0)
  # D7 seeds raised from 3 to 10 on 28/11 (My), after B and before any D episode: B cannot
  # measure the Safety Gate (0 unsafe migrations for every method), D7 is the RQ3 test
  d7_seeds: [9801, 9802, 9803, 9804, 9805, 9806, 9807, 9808, 9809, 9810]
  d7_levels: [0.5, 0.6, 0.7, 0.8, 0.9]
  d7_methods: [full, threshold]
