# Week 15 Day 5: does a model trained on 2C20S still work on 4C40S, or must it be retrained?
# Declared BEFORE any 4C run of this test. Owner: My (writes), Vy (reviews, runs on the VM).
# Nothing is retrained in this test; U is computed with capacity-v5.
schema_version: "1.0"
topology: 4C40S
controllers_config: configs/controllers_4c40s.yaml
capacity: data/benchmarks/controller_capacity_v5.json   # written by export_4c40s_sweeps.py --derive

# New seeds: not 101-105 (forecast), 9201-9205 (outcome), 9501, 9601 (closed loop 2C).
seeds: [9701, 9702]            # forecast runs; the outcome attempts list their own seeds

forecast:
  models: data/models/forecasting/forecast-models-v3     # frozen, trained on 2C20S
  workloads: [stable, gradual, burst, oscillating, hot_switch]
  duration_seconds: 180                                 # as the 2C forecast runs
  # One run per workload and seed, every controller on the workload (10 runs, ~35 min).

outcome:
  models: data/models/outcome/post-migration-v1          # frozen, trained on 2C20S
  variants: [analytical, direct_xgb, hybrid_xgb]
  destination_load_levels: [0.45, 0.75]                  # the levels the models were trained on
  workloads: [stable, gradual, burst, oscillating, hot_switch]
  # Revised 18/11, before any 4C run: 2 -> 5 seeds. With 2 seeds only 16 attempts were on seen
  # workloads and coverage >= 0.95 allowed no miss at all (15/16 = 0.9375).
  seeds: [9701, 9702, 9703, 9704, 9705]
  # 5 workloads x 2 levels x 5 seeds = 50 MIGRATE attempts (40 on seen workloads: coverage
  # >= 0.95 <=> at most 2 misses), source c1, destination drawn among c2-c4 with the seed
  # (the 2C models never saw a choice of destination). Still below 0.95 -> retrain.

# Decision rule, fixed now. Reuse = keep the 2C model for the 4C campaign; otherwise retrain
# in 23/11-01/12 on 4C data (outcome: the Day 6 collection).
decision:
  forecast_reuse_if:
    rmse_ratio_vs_persistence_max: 1.0      # macro-average over the four seen workloads < 1
    margin_coverage_min: 0.95               # coverage of m_f on the 4C runs
  outcome_reuse_if:
    hybrid_beats_analytical: true           # RMSE of u_dst_post
    margin_coverage_min: 0.95               # coverage of m_U on the 4C attempts
  hot_switch: report_only                   # unseen workload: reported, never decides

output: evidence/week15/transfer_4c.json
