# Week 11 State-Action-Outcome collection (scripted migrations, 2C20S).
# Owner: My (writes), Vy (reviews). Validated by
# src/experiments/migration/config.py; the runner expands it with
# expand_attempts(): 5 workloads x 3 phases x 2 destination levels
# x 2 directions x 5 repeats = 300 MIGRATE attempts + no_op_controls NO_OP.
# Once the pilot (Day 3) freezes this file, do not edit it until Day 5:
# every attempt records its sha256 in metadata.json.
schema_version: migration-outcome-v1
topology: 2C20S
controllers_config: configs/controllers_2c20s.yaml
output_root: data/experiment_runs/migration-outcome-v1

# Hard-Gate-valid consecutive snapshots before / after the transaction.
pre_window_valid_snapshots: 5
post_window_valid_snapshots: 5
post_window_timeout_s: 60

# Phase names must match the workload_trace phases Vy writes.
# hot_switch levels (moderate/high/peak) = three hot_switch_share values,
# to be fixed together on Day 1.
workloads:
  stable: [early, middle, late]
  gradual: [u40, u60, u95]
  burst: [baseline_1, burst_1, recovery]
  oscillating: [rising, peak, falling]
  hot_switch: [moderate, high, peak]

# Target controller held at a constant U while the source follows the workload.
destination_load_levels: [0.45, 0.75]
directions: [[c1, c2], [c2, c1]]

# New seeds for Week 11 (forecast data used 101-105). Never change mid-collection.
repeats: {r01: 9201, r02: 9202, r03: 9203, r04: 9204, r05: 9205}
split: {train: [r01, r02, r03], validation: [r04], test: [r05]}

# Control attempts without migration: one cell per (workload, level, direction)
# at the middle phase, 2 repeats per cell, spread evenly over r01-r05
# (8 per repeat).
no_op_controls: 40
