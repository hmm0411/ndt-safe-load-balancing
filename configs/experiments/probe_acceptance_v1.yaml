# Day 3 acceptance criteria of the flow-setup probe (Week 15), written BEFORE the probe sweep
# is read. Rationale: evidence/week15/probe_acceptance.md. Read by
# src/experiments/capacity/probe_acceptance.py. Owner: My (writes), Vy (reviews).
# Changing a value after evidence/week15/probe_sweep_summary.json exists -> v2, and say so.
schema_version: "1.0"
baseline_rate_fps: 30          # every controller at 30 fps = the background of the sweep
rates_fps: [30, 90, 140]

# P1 isolation: when one controller is loaded, the other three stay healthy and the loaded
# one is the controller whose latency rose most. Revised 18/11 21:45, BEFORE any probe
# number was read (evidence/week15/probe_acceptance.md, "Sửa trước khi đọc số"):
# 1.5 -> 2.0 = the "healthy" bound of capacity_v5_rules.yaml (setup P95 <= 2 x baseline), so
# a controller is not called disturbed while capacity-v5 still calls it healthy; the four
# controllers share one 8-vCPU host, whose contention is not a fault of the probe.
isolation_max_ratio: 2.0       # non-target mean P95 <= 2.0 x its own baseline mean
isolation_target_must_rank_first: true   # target P95 / baseline > every other controller's

# P2 monotone: the target's mean P95 increases strictly 30 -> 90 -> 140 fps, every controller.

# P3 saturation visible at the highest rate: timeouts > 0 OR mean P95 >= ratio x baseline.
saturation_min_ratio: 2.0

# P4 probe-induced load: |U(probe on) - U(probe off)| at the baseline, per controller.
# Revised 18/11 21:45, before reading: 0.02 -> 0.037 = m_U of post-migration-v1, the
# smallest margin the Safety Gate budgets; the probe stays on in every episode, so its load is
# in U consistently, and a shift below m_U is inside the uncertainty already allowed for.
probe_load_max_delta_u: 0.037

# P5 enough samples: per run and controller, at least this share of the expected samples
# (10 switches x rate_per_second x measurement_seconds of probe_sweep_4c40s.yaml).
min_sample_share: 0.95
expected_switches_per_controller: 10
probe_rate_per_second: 1.0
measurement_seconds: 60

# Decision (plan 16-22/11, Day 3): all five pass -> Huong 3 (R95 = per-controller flow-setup
# P95 from this probe); any fails -> Huong 2. The criteria are not relaxed after the numbers.
