# Forecast model training settings (scripts/experiments/train_forecast_baselines.py).
#
# Change hyperparameter grids here instead of in code: every candidate becomes
# a child run in MLflow, and the selected one is the lowest VALIDATION RMSE.
# Test and unseen splits are evaluated once, after selection.

mlflow:
  enabled: true
  # A local SQLite file next to the repo root. Use an http:// URI to log to a
  # running `mlflow server` instead.
  tracking_uri: sqlite:///mlflow.db
  experiment: ndt-forecasting
  # CPU/RAM/disk/network of the training process in the "System metrics"
  # tab (needs psutil, listed in requirements-ml.txt).
  system_metrics: true
  system_metrics_interval_seconds: 2
  # Register the selected Random Forest / XGBoost in the Model Registry
  # (or pass --register). Each new version gets the alias below; promoting a
  # version to "champion" is a manual decision in the UI.
  register_models: false
  candidate_alias: challenger
  registered_names:
    random_forest: ndt-forecast-random-forest
    xgboost: ndt-forecast-xgboost

moving_average:
  windows: [3, 5, 10]

# Week 10 (M1): 24 Random Forest + 32 XGBoost candidates.
random_forest:
  fixed:
    n_jobs: -1
    random_state: 42
  grid:
    n_estimators: [300, 600]
    max_depth: [6, 10, null]
    min_samples_leaf: [5, 20]
    max_features: [0.5, 1.0]

xgboost:
  fixed:
    n_estimators: 1000
    reg_lambda: 1.0
    objective: reg:squarederror
    tree_method: hist
    early_stopping_rounds: 50
    n_jobs: -1
    random_state: 42
  grid:
    max_depth: [3, 5]
    learning_rate: [0.05, 0.1]
    min_child_weight: [1, 5]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]

# Model selection score S_m across model families (lower is better), computed
# on the VALIDATION split only. Errors are normalized by persistence; latency
# is the single-sample p95 in ms, normalized by 1000 ms and capped at 1.
selection:
  weights:
    rmse: 0.45
    p95: 0.30
    mae: 0.15
    latency: 0.10
  # A gap below this between the two best tree models is reported as a tie.
  tie_tolerance: 0.01
  # Single-sample latency used inside S_m (the runtime benchmark is
  # scripts/experiments/benchmark_forecast_inference.py, 50 + 1000).
  latency_warmup: 50
  latency_repeats: 200
